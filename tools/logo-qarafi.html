<!doctype html>
<html lang="ar" dir="ltr"><head><meta charset="utf-8"><title>شعار مجمع الإمام القرافي</title>
<link rel="stylesheet" href="/assets/fonts/fonts.css?v=3">
<style>html,body{margin:0;background:transparent;overflow:hidden}svg{display:block}</style></head><body>
<svg id="logo" width="1200" height="1200" viewBox="0 0 1200 1200" xmlns="http://www.w3.org/2000/svg">
<defs>
  <radialGradient id="disc" cx="50%" cy="34%" r="78%"><stop offset="0" stop-color="#9DC1EE"/><stop offset=".5" stop-color="#4F82C4"/><stop offset="1" stop-color="#244B86"/></radialGradient>
  <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#F6E3A1"/><stop offset=".5" stop-color="#D4A93A"/><stop offset="1" stop-color="#9A7019"/></linearGradient>
  <linearGradient id="goldV" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#FFF0B3"/><stop offset=".55" stop-color="#E2B73F"/><stop offset="1" stop-color="#B8861F"/></linearGradient>
  <linearGradient id="ribbon" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#FFE56B"/><stop offset=".55" stop-color="#F6CB2F"/><stop offset="1" stop-color="#D9A514"/></linearGradient>

  <linearGradient id="red" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#F0525A"/><stop offset=".5" stop-color="#C7202E"/><stop offset="1" stop-color="#8E1220"/></linearGradient>
  <linearGradient id="pageL" x1="1" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#FFFFFF"/><stop offset="1" stop-color="#E9DFC4"/></linearGradient>
  <linearGradient id="pageR" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#FFFFFF"/><stop offset="1" stop-color="#E9DFC4"/></linearGradient>
  <radialGradient id="cream" cx="50%" cy="45%" r="60%"><stop offset="0" stop-color="#FFFFFF"/><stop offset="1" stop-color="#F3EBD3"/></radialGradient>
  <filter id="sh" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="8" stdDeviation="9" flood-color="#000" flood-opacity=".38"/></filter>
  <filter id="sh2" x="-10%" y="-10%" width="120%" height="130%"><feDropShadow dx="0" dy="5" stdDeviation="5" flood-color="#000" flood-opacity=".3"/></filter>
  <path id="topArc" d="M188,792 A455,455 0 1 1 1012,792"/>
  <path id="ribbonText" d="M170,923 Q600,987 1030,923"/>
  <clipPath id="discClip"><circle cx="600" cy="600" r="358"/></clipPath>
</defs>

<!-- القاعدة: حلقة كريميّة بإطارين -->
<circle cx="600" cy="600" r="588" fill="url(#gold)"/>
<circle cx="600" cy="600" r="578" fill="#1F2E6B"/>
<circle cx="600" cy="600" r="571" fill="url(#cream)"/>
<circle cx="600" cy="600" r="396" fill="none" stroke="url(#gold)" stroke-width="7"/>
<circle cx="600" cy="600" r="406" fill="none" stroke="#1F2E6B" stroke-width="2" opacity=".55"/>

<!-- الاسم اللاتينيّ على القوس -->
<text font-family="Cairo, 'Alexandria', sans-serif" font-weight="800" font-size="104" fill="url(#purple)" letter-spacing="3" stroke="#2A1B63" stroke-width="1.2" paint-order="stroke">
  <textPath href="#topArc" startOffset="50%" text-anchor="middle" textLength="1500" lengthAdjust="spacing">COMPLEXE ALGHARAFI</textPath></text>

<!-- نجمتان ثمانيّتان تفصلان نهايتي القوس -->
<g fill="url(#gold)" stroke="#8A6212" stroke-width="2">
  <g transform="translate(184 782)"><rect x="-22" y="-22" width="44" height="44"/><rect x="-22" y="-22" width="44" height="44" transform="rotate(45)"/></g>
  <g transform="translate(1016 782)"><rect x="-22" y="-22" width="44" height="44"/><rect x="-22" y="-22" width="44" height="44" transform="rotate(45)"/></g>
</g>

<!-- القرص الأزرق -->
<circle cx="600" cy="600" r="366" fill="url(#gold)" filter="url(#sh)"/>
<circle cx="600" cy="600" r="358" fill="url(#disc)"/>
<g clip-path="url(#discClip)">

  <g transform="translate(600 560)" fill="none" stroke="#FFFFFF" stroke-opacity=".16" stroke-width="3">
    <rect x="-250" y="-250" width="500" height="500"/><rect x="-250" y="-250" width="500" height="500" transform="rotate(45)"/>
    <circle r="190"/><circle r="300" stroke-opacity=".1"/>
  </g>
  <radialGradient id="shine" cx="35%" cy="18%" r="70%"><stop offset="0" stop-color="#fff" stop-opacity=".35"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></radialGradient>
  <ellipse cx="520" cy="330" rx="300" ry="190" fill="url(#shine)"/>
</g>
<circle cx="600" cy="600" r="344" fill="none" stroke="#FFFFFF" stroke-opacity=".55" stroke-width="3"/>

<g filter="url(#sh)">
  <path d="M600,768 C520,722 410,712 318,742 L318,566 C410,532 520,542 600,590 C680,542 790,532 882,566 L882,742 C790,712 680,722 600,768 Z" fill="url(#red)"/>
  <path d="M600,750 C522,708 420,698 332,726 L332,556 C420,526 520,536 600,582 Z" fill="url(#pageL)"/>
  <path d="M600,750 C678,708 780,698 868,726 L868,556 C780,526 680,536 600,582 Z" fill="url(#pageR)"/>
  <path d="M332,726 C420,698 522,708 600,750" fill="none" stroke="#C9B98E" stroke-width="3"/>
  <path d="M868,726 C780,698 678,708 600,750" fill="none" stroke="#C9B98E" stroke-width="3"/>
  <path d="M600,582 L600,752" stroke="#A8923F" stroke-width="5"/>
  <g stroke="#B5A57A" stroke-width="4" stroke-linecap="round" fill="none" opacity=".85">
    <path d="M362,590 C430,574 520,580 574,612"/><path d="M362,626 C430,610 520,616 574,648"/><path d="M362,662 C430,646 520,652 574,684"/><path d="M362,698 C430,684 500,688 548,712"/>
    <path d="M638,612 C690,580 780,574 838,590"/><path d="M638,648 C690,616 780,610 838,626"/><path d="M638,684 C690,652 780,646 838,662"/>
  </g>
  <path d="M318,742 C410,712 520,722 600,768 C680,722 790,712 882,742" fill="none" stroke="#6E0C18" stroke-width="5"/>
</g>

<!-- القلم الحبر -->
<g transform="translate(646 592) rotate(32)" filter="url(#sh2)">
  <path d="M0,0 L-17,-74 L0,-96 L17,-74 Z" fill="url(#goldV)" stroke="#8A6212" stroke-width="2"/>
  <path d="M0,-10 L0,-72" stroke="#7A560F" stroke-width="2.2"/><circle cx="0" cy="-72" r="4.5" fill="#7A560F"/>
  <path d="M-21,-74 L-31,-158 L31,-158 L21,-74 Z" fill="#161616" stroke="#000" stroke-width="2"/>
  <rect x="-35" y="-176" width="70" height="20" rx="4" fill="url(#goldV)" stroke="#8A6212" stroke-width="2"/>
  <rect x="-36" y="-352" width="72" height="178" rx="22" fill="url(#red)" stroke="#6E0C18" stroke-width="3"/>
  <rect x="-24" y="-338" width="9" height="140" rx="4.5" fill="#fff" opacity=".35"/>
  <rect x="-36" y="-262" width="72" height="12" fill="url(#goldV)"/>
  <rect x="-5" y="-352" width="10" height="64" rx="5" fill="url(#goldV)" stroke="#8A6212" stroke-width="2"/>
</g>
<!-- أثر الحبر -->
<path d="M648,594 C690,616 726,606 762,626" fill="none" stroke="url(#goldV)" stroke-width="5" stroke-linecap="round" opacity=".9"/>

<!-- لوحة الشعار الصغير -->
<g filter="url(#sh2)">
  <rect x="402" y="776" width="396" height="62" rx="31" fill="url(#cream)" stroke="url(#gold)" stroke-width="4"/>
</g>
<text x="600" y="821" text-anchor="middle" font-family="Tajawal, Cairo, sans-serif" font-weight="700" font-size="44" fill="#1F2E6B" direction="rtl">علم&#160;&#160;–&#160;&#160;عمل&#160;&#160;–&#160;&#160;دعوة</text>

<!-- الشريط الأصفر -->
<g filter="url(#sh)">
  <path d="M170,846 L40,826 L96,926 L40,1028 L170,1008 Z" fill="url(#ribbonDark)"/>
  <path d="M1030,846 L1160,826 L1104,926 L1160,1028 L1030,1008 Z" fill="url(#ribbonDark)"/>
  <path d="M170,836 Q600,900 1030,836 L1030,1010 Q600,1074 170,1010 Z" fill="url(#ribbon)" stroke="#B8860B" stroke-width="3"/>
  <path d="M170,836 L170,1010 L112,960 Z" fill="#B88A0C" opacity=".55"/><path d="M1030,836 L1030,1010 L1088,960 Z" fill="#B88A0C" opacity=".55"/>
  <path d="M184,850 Q600,914 1016,850" fill="none" stroke="#fff" stroke-opacity=".55" stroke-width="3"/>
  <path d="M184,998 Q600,1062 1016,998" fill="none" stroke="#B8860B" stroke-opacity=".7" stroke-width="3"/>
</g>
<text font-family="Tajawal, Cairo, sans-serif" font-weight="800" font-size="84" fill="#17235E" direction="rtl" stroke="#fff" stroke-opacity=".35" stroke-width="2" paint-order="stroke">
  <textPath href="#ribbonText" startOffset="50%" text-anchor="middle" dy="40">مجمع الإمام القرافي</textPath></text>
</svg>
</body></html>
