      line(T["sheikh-post"], "500 20px var(--fs)", "var(--fg2)", 2, .52);
      line([T.scope, T.session].filter(Boolean).join(" · "), "500 22px var(--fs)", "var(--fg2)", 14, .6);
      const c = line(" ", "700 70px var(--fa)", "var(--accent-hi)", 20, .7); c.classList.add("count");
      tick = () => { const s = countdownTo(T.start); c.textContent = s == null ? "" : s > 0 ? mmss(s) : "يبدأ الآن"; c.style.fontSize = s > 0 ? "66px" : "40px"; };
    } else if (kind === "break") {
      line("استراحة", "700 72px var(--fa)", "var(--fg)", 0, .15);
      orn(.3);
      line("نعود إليكم بعد", "500 24px var(--fs)", "var(--accent-hi)", 0, .4);
      const c = line(" ", "700 84px var(--fa)", "var(--accent-hi)", 8, .5); c.classList.add("count");
      const end = (S.breakAt || Date.now()) + Number(T["break-min"] || 10) * 60000;
      tick = () => { const s = Math.round((end - Date.now()) / 1000); c.textContent = s > 0 ? mmss(s) : "نستأنف الآن"; c.style.fontSize = s > 0 ? "84px" : "42px"; };
      line(T.programFull, "500 22px var(--fs)", "var(--fg2)", 18, .6);
    } else {
      line("جزاكم الله خيراً", "700 64px var(--fa)", "var(--fg)", 0, .15);
      line("وبارك في علمكم وأوقاتكم", "500 24px var(--fs)", "var(--accent-hi)", 10, .25);
      orn(.35);
      line(T.next || "تابعونا في المجلس القادم بإذن الله", "700 34px var(--fa)", "var(--fg)", 0, .45);
      line(T.programFull, "500 22px var(--fs)", "var(--fg2)", 14, .55);
    }
    const top = el("div", { left: 0, right: 0, top: "34px", textAlign: "center", font: "500 22px var(--fs)", color: "var(--fg2)" }, b, "abs rise");
    top.textContent = AR([T.mosque, T.date].filter(Boolean).join("  ·  "));
    // شعارات الجهة والرعاة لا تظهر في «قبل البثّ» و«الاستراحة» و«الختام»: الشعار الظاهر فيها هو شعار الحلقة وحده
    const q = el("div", { left: "60px", bottom: "36px", animationDelay: "1s" }, b, "abs rise"); qr(q, 132);
    clearInterval(window.__t); if (tick) { tick(); window.__t = setInterval(tick, 500); }
  });
</script>
