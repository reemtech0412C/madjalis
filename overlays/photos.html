<!doctype html>
<html lang="ar" dir="rtl"><head><meta charset="utf-8"><title>صور فوق المشهد</title>
<link rel="stylesheet" href="ov.css"></head>
<body>
<script src="themes.js"></script><script src="ov.js"></script><script src="podkit.js"></script>
<script>
  // صور تُركَّب فوق مشاهد الكاميرات (البودكاست): أكثر من صورة معاً أو في أوقات مختلفة من الحلقة.
  // تظهر الصورة إذا فُعِّل «إظهار الآن»، أو داخل نافذتها [من، المدّة] محسوبةً من بدء البثّ/التسجيل. تبقى العناصر حيّة (لا إعادة بناء) فيتلاشى ظهورها وإخفاؤها بنعومة.
  const POS = { tl: [0, 0], tc: [1, 0], tr: [2, 0], ml: [0, 1], mc: [1, 1], mr: [2, 1], bl: [0, 2], bc: [1, 2], br: [2, 2] };
  const M = { x: 56, top: 120, bot: 150 };
  let root = null, S0 = null, map = new Map(), tm = 0;
  function build(it, S) {
    const ov = it.ov || {}, shape = PK.cfg(S).shape, t = S._t;
    const w = Math.round(1920 * Math.max(8, Math.min(70, ov.w || 26)) / 100);
    const paper = ((S.photos || {}).frame || PK.cfg(S).pframe) === "paper";
    const wrap = el("div", { left: 0, top: 0, width: w + "px", opacity: 0, transform: "scale(.94)", transition: "opacity .7s ease, transform .7s cubic-bezier(.16,1,.3,1)", pointerEvents: "none" }, root, "abs");
    const img = new Image(); img.src = it.file.startsWith("/") ? it.file : "/media/" + encodeURIComponent(it.file);
    img.onload = () => {
      let card = null; const x = POS[ov.pos || "br"] || POS.br;
      if (paper) card = PK.paperCard({ w, ar: img.naturalHeight / img.naturalWidth, src: img.src, cap: it.cap, rot: x[0] === 2 ? 3 : x[0] === 0 ? -3 : 1.2, seed: (it.id || "").length * 7 + 5 });
      const h = card ? card.h : Math.min(Math.round(w * img.naturalHeight / img.naturalWidth), 640);
      const left = x[0] === 0 ? M.x : x[0] === 1 ? Math.round((1920 - w) / 2) : 1920 - M.x - w;
      const top = x[1] === 0 ? M.top : x[1] === 1 ? Math.round((1080 - h) / 2) : 1080 - M.bot - h;
      Object.assign(wrap.style, { left: left + "px", top: top + "px", height: h + "px" });
      if (card) { wrap.appendChild(card.el); return; }
      const clip = el("div", { inset: 0, overflow: "hidden", clipPath: `path('${shapePath(shape, w, h)}')`, background: t.deep }, wrap, "abs");
      Object.assign(img.style, { position: "absolute", inset: 0, width: "100%", height: "100%", objectFit: "cover" }); clip.appendChild(img);
      const sv = document.createElementNS("http://www.w3.org/2000/svg", "svg"); sv.setAttribute("width", w); sv.setAttribute("height", h); sv.style.cssText = "position:absolute;left:0;top:0;overflow:visible;filter:drop-shadow(0 12px 30px rgba(0,0,0,.5))";
      sv.innerHTML = `<path d="${shapePath(shape, w, h)}" fill="none" stroke="${t.accent}" stroke-width="3"/>`; wrap.appendChild(sv);
      if (it.cap) { const c = el("div", { left: "50%", bottom: "-18px", transform: "translateX(-50%)", padding: "8px 26px", borderRadius: "99px", background: PK.rgba(t.deep, .88), border: "1.5px solid " + t.accent, font: "600 26px var(--fa)", color: "var(--fg)", whiteSpace: "nowrap", maxWidth: (w + 40) + "px", overflow: "hidden", textOverflow: "ellipsis" }, wrap, "abs"); c.textContent = AR(it.cap); }
    };
    return wrap;
  }
  function sync() {
    const S = S0; if (!S || !root) return;
    const P = S.photos || {}, items = P.items || [], el0 = S.liveSince ? (Date.now() - S.liveSince) / 1000 : -1, ids = new Set();
    for (const it of items) {
      if (!it.file) continue; ids.add(it.id);
      const ov = it.ov || {}, sig = JSON.stringify([it.file, it.cap, ov.pos, ov.w, S.podcast, (S.photos || {}).frame, PK.cfg(S).pframe]);
      let e = map.get(it.id);
      if (!e || e.sig !== sig) { if (e) e.wrap.remove(); e = { sig, wrap: build(it, S) }; map.set(it.id, e); }
      const vis = !!ov.on || (ov.dur > 0 && el0 >= (ov.at || 0) && el0 < (ov.at || 0) + ov.dur);
      e.wrap.style.opacity = vis ? 1 : 0; e.wrap.style.transform = vis ? "none" : "scale(.94)";
    }
    for (const [id, e] of map) if (!ids.has(id)) { e.wrap.remove(); map.delete(id); }
  }
  boot(S => {
    S0 = S;
    if (!root || !root.isConnected) { root = el("div", { inset: 0 }, document.body, "abs"); root.dataset.keep = 1; map = new Map(); }
    sync(); if (!tm) tm = setInterval(sync, 400);
  });
</script>
</body></html>
